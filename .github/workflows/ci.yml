name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (with race detector)
        run: go test -race ./...

      - name: Build portable package (bash)
        if: runner.os == 'Linux'
        run: bash scripts/build.sh ci

      - name: Build portable package (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 ci

      - name: Check the portable folder
        shell: bash
        run: |
          for f in tunneltab.exe tunneltab-linux-amd64 README.txt LICENSE.txt THIRD_PARTY_NOTICES.txt; do
            test -s "dist/tunneltab/$f" || { echo "missing dist/tunneltab/$f"; exit 1; }
          done
          test -s dist/SHA256SUMS.txt

      - name: Upload portable zip (for manual testing)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: tunneltab-portable-${{ github.sha }}
          path: dist/tunneltab-ci.zip
          retention-days: 14

  lint:
    name: Static analysis and vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install test tools
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run dashboard walkthrough
        working-directory: tests/e2e
        run: node run.js

      - name: Run "Update now" test
        working-directory: tests/e2e
        run: node update.js

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-screenshots
          path: tests/e2e/screenshots/
          if-no-files-found: ignore
