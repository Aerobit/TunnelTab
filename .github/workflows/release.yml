name: Release

# Push a tag like v0.1.0 to build the portable zip and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Build portable package
        run: bash scripts/build.sh "${GITHUB_REF_NAME}"

      - name: Sign checksums
        # The private key is the TUNNELTAB_SIGNING_KEY repository secret.
        # Verifying with the key built into the app catches a secret that
        # doesn't match internal/update.ReleasePublicKey before publishing.
        env:
          TUNNELTAB_SIGNING_KEY: ${{ secrets.TUNNELTAB_SIGNING_KEY }}
        run: |
          go run ./scripts/signsums sign dist/SHA256SUMS.txt
          go run ./scripts/signsums verify dist/SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section for this version, without its heading.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > dist/RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' dist/RELEASE_NOTES.md; then
            echo "CHANGELOG.md has no section for $version"; exit 1
          fi
          printf '\n---\nDownload **tunneltab-%s.zip**, extract it, and run tunneltab.exe (Windows) or tunneltab-linux-amd64 (Linux). Verify with SHA256SUMS.txt. See the [user guide](https://github.com/Aerobit/TunnelTab/blob/main/docs/USER_GUIDE.md).\n' "$version" >> dist/RELEASE_NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/tunneltab-*.zip dist/SHA256SUMS.txt dist/SHA256SUMS.txt.sig \
            --title "TunnelTab ${GITHUB_REF_NAME}" --notes-file dist/RELEASE_NOTES.md
